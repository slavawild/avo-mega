name: Build Avo MP4 Camera (macOS)

# Build only the tip of this development branch. A PR event previously
# queued obsolete snapshots of its merge ref alongside newer commits.
on:
  push:
    branches:
      - feature/mp4-camera-source
  workflow_dispatch:

permissions:
  contents: read

# Keep only the newest test build while the branch is being developed.
concurrency:
  group: avo-mp4-camera-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build for Apple Silicon
    runs-on: macos-26
    timeout-minutes: 90

    steps:
      - name: Check out source and submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Check toolchain
        run: |
          uname -m
          xcodebuild -version
          swift --version

      - name: Install build dependencies
        run: |
          brew install xcodegen cmake ninja
          if ! command -v cargo >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build the optional GPU renderer
        id: gfx
        continue-on-error: true
        run: make gfxstream

      - name: Work around Swift 6.3 diagnostic crash in pinned avo_kit
        run: |
          python3 - <<'PY'
          from pathlib import Path
          file = Path("vendor/avo_kit/Sources/AvoKeymapUI/KeymapEditorView.swift")
          source = file.read_text()
          old = "let dropTarget = padDrag.flatMap { dropTarget(for: $0.element, at: $0.at) }"
          new = """let dropTarget: String?
                  if let padDrag {
                      dropTarget = self.dropTarget(for: padDrag.element, at: padDrag.at)
                  } else {
                      dropTarget = nil
                  }"""
          assert old in source, "upstream source has changed; remove workaround"
          file.write_text(source.replace(old, new))
          PY

      - name: Test virtio-sound engine
        run: cargo test --manifest-path engine/hvf/Cargo.toml -p avo-vmm

      - name: Test camera models and camera feed
        run: |
          cd host/AvoKit
          swift test --filter CameraSettingsTests
          swift test --filter CameraFeedTests

      - name: Build Avo for Apple Silicon
        run: |
          set -o pipefail
          mkdir -p build
          make build 2>&1 | tee build/xcodebuild.log

      - name: Verify app and package ZIP
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Debug/Avo.app"
          test -d "$APP"
          test -x "$APP/Contents/MacOS/Avo"
          test -x "$APP/Contents/MacOS/avo-vmm"
          codesign --verify --deep --strict "$APP"
          ditto -c -k --keepParent "$APP" "build/Avo-MP4-Camera-macOS-arm64.zip"

      - name: Upload installable Avo (unsigned test build)
        uses: actions/upload-artifact@v4
        with:
          name: Avo-MP4-Camera-macOS-arm64
          path: build/Avo-MP4-Camera-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log if anything fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Avo-MP4-Camera-build-log
          path: |
            build/xcodebuild.log
            build/gfxstream-src/*log
          if-no-files-found: ignore
          retention-days: 14
